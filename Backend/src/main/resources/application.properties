spring.application.name=exam-platform

server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/exam_platform}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1


jwt.secret=${JWT_SECRET}
jwt.refresh-expiration-ms=10800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Keep false for local HTTP; set true when serving over HTTPS in production.
auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
auth.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Exact origins only; leave empty when the frontend uses a same-origin proxy.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}